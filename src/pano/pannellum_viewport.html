<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/pannellum.css">
    <script src="/js/pannellum.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #555;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        #panorama {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 32px;
            padding: 16px 4px;
            font-size: 13px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 140px;
            accent-color: #333;
        }

        input[type="number"] {
            width: 56px;
            padding: 2px 0;
            border: none;
            border-bottom: 1px solid #bbb;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-bottom-color: #333;
        }

        button {
            margin-left: auto;
            padding: 6px 16px;
            border: 1px solid #bbb;
            border-radius: 999px;
            background: transparent;
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        button:hover {
            border-color: #333;
            color: #333;
        }

        @media (max-width: 768px) {
            #panorama {
                height: 300px;
            }

            button {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="panorama"></div>

        <div class="controls">
            <label>Height
                <input type="range" id="heightSlider" min="200" max="800" value="500" step="50">
            </label>

            <label>Speed
                <input type="number" id="rotateSpeed" min="-10" max="10" step="0.5" value="2">°/s
            </label>

            <button id="rotateBtn">Pause</button>
        </div>
    </div>

<script>
    const basePath = '/img/pano-test/';

    const viewer = pannellum.viewer('panorama', {
        title: 'Grand Horizon, Tsingyi, Hongkong',
        author: 'Barry, Sep 2007',
        northOffset: 130,
        pitch: 0,
        yaw: 0,
        hfov: 100,
        type: 'cubemap',
        cubeMap: [
            basePath + '0.jpg',
            basePath + '1.jpg',
            basePath + '2.jpg',
            basePath + '3.jpg',
            basePath + '4.jpg',
            basePath + '5.jpg'
        ],
        autoLoad: true,
        autoRotate: 2,
        autoRotateInactivityDelay: 2000,
        showControls: true,
        compass: true,
        mouseZoom: true,
        draggable: true,
        friction: 0.15
    });

    const panoElement = document.getElementById('panorama');
    const speedInput = document.getElementById('rotateSpeed');
    const rotateBtn = document.getElementById('rotateBtn');

    const speed = () => parseFloat(speedInput.value) || 2;
    const syncButton = () => {
        rotateBtn.textContent = viewer.isAutoRotationActive() ? 'Pause' : 'Rotate';
    };

    document.getElementById('heightSlider').addEventListener('input', function() {
        panoElement.style.height = this.value + 'px';
    });

    speedInput.addEventListener('change', function() {
        if (viewer.isAutoRotationActive()) viewer.startAutoRotate(speed());
    });

    rotateBtn.addEventListener('click', function() {
        if (viewer.isAutoRotationActive()) {
            viewer.stopAutoRotate();
        } else {
            viewer.startAutoRotate(speed());
        }
        syncButton();
    });

    // Keep the label accurate when rotation stops/resumes on drag or inactivity
    setInterval(syncButton, 500);
</script>

</body>
</html>
