---
layout: false
title: Viewport demo
eleventyExcludeFromCollections: true
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/css/pannellum.css">
    <script src="/js/pannellum.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #555;
            padding: 20px;
        }

        .container {
            width: 90%;
            margin: 0 auto;
        }

        #panorama {
            width: 100%;
            height: 80vh;
            border-radius: 8px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 32px;
            padding: 16px 4px;
            font-size: 13px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #heightValue {
            min-width: 3ch;
            text-align: right;
        }

        input[type="range"] {
            width: 140px;
            accent-color: #333;
        }

        input[type="number"] {
            width: 56px;
            padding: 2px 0;
            border: none;
            border-bottom: 1px solid #bbb;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-bottom-color: #333;
        }

        .back {
            display: inline-block;
            margin-bottom: 12px;
            font-size: 14px;
            color: #333;
            text-decoration: none;
        }

        .back:hover {
            color: #333;
            text-decoration: underline;
        }

        button {
            margin-left: auto;
            padding: 6px 16px;
            border: 1px solid #bbb;
            border-radius: 999px;
            background: transparent;
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        button:hover {
            border-color: #333;
            color: #333;
        }

        @media (max-width: 768px) {
            button {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="{{ '/pano/' | url }}">← Panoramas</a>
        <div id="panorama"></div>

        <div class="controls">
            <label>Height
                <input type="range" id="heightSlider" min="30" max="90" value="80" step="5">
                <span id="heightValue">80%</span>
            </label>

            <label>Speed
                <input type="number" id="rotateSpeed" min="-10" max="10" step="0.5" value="2">°/s
            </label>

            <button id="rotateBtn">Pause</button>
        </div>
    </div>




<script>
    const viewer = pannellum.viewer('panorama', {
        title: 'Double Cove, Hongkong',
        author: 'Barry, Sep 2015',
        type: 'equirectangular',
        panorama: '/img/pano-test/DoubleCoveEntrance.jpg',

        // 3. Initial camera & zoom limits
        pitch: 0,
        yaw: 0,
        hfov: 160,

        // 4. Playback & controls
        northOffset: 130,
        autoLoad: true,
        autoRotate: 2,
        autoRotateInactivityDelay: 30000,
        showControls: true,
        compass: true,
        mouseZoom: true,
        draggable: true,
        friction: 0.15
    });

    const panoElement = document.getElementById('panorama');
    const heightSlider = document.getElementById('heightSlider');
    const heightValue = document.getElementById('heightValue');
    const speedInput = document.getElementById('rotateSpeed');
    const rotateBtn = document.getElementById('rotateBtn');

    let rotating = true;

    function getSpeed() {
        const value = parseFloat(speedInput.value);
        return isNaN(value) ? 2 : value;
    }

    heightSlider.addEventListener('input', function() {
        panoElement.style.height = this.value + 'vh';
        heightValue.textContent = this.value + '%';
        viewer.resize();
    });

    speedInput.addEventListener('input', function() {
        if (rotating) viewer.startAutoRotate(getSpeed());
    });

    rotateBtn.addEventListener('click', function() {
        rotating = !rotating;
        if (rotating) {
            viewer.startAutoRotate(getSpeed());
        } else {
            viewer.stopAutoRotate();
        }
        rotateBtn.textContent = rotating ? 'Pause' : 'Rotate';
    });
</script>

</body>
</html>
