<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannellum - Auto-Load</title>
    <link rel="stylesheet" href="/css/pannellum.css">
    <script src="/js/pannellum.js"></script>
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">-->
    <!--<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .viewer-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }

        #panorama {
            width: 100%;
            height: 500px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
        }

        .size-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            font-weight: 500;
        }

        button:hover {
            background: #0b7dda;
        }

        .info {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            #panorama {
                height: 300px;
            }

            .size-controls,
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-wrapper">
            <div id="panorama"></div>
        </div>

        <div class="controls">
            <h3>Configuration</h3>

            <div class="size-controls">
                <div class="input-group">
                    <label>Viewer Height: <span id="heightValue">500px</span></label>
                    <input type="range" id="heightSlider" min="200" max="800" value="500" step="50">
                </div>

                <div class="input-group">
                    <label>Auto-Rotate Speed:</label>
                    <input type="number" id="rotateSpeed" min="-10" max="10" step="0.5" value="2" placeholder="2">
                    <small style="color: #888;">Degrees/second (-10 to 10)</small>
                </div>
            </div>

            <div class="button-group">
                <button id="startRotateBtn">Start Rotate</button>
                <button id="stopRotateBtn">Stop Rotate</button>
            </div>

            <div class="info">
                💡 <strong>Pannellum Features:</strong><br>
                • Automatically loads on page load (no click needed)<br>
                • Built-in auto-rotate with speed control<br>
                • Auto-resume rotation after user interaction
            </div>
        </div>
    </div>

<script>
    const basePath = '/img/pano-test/';

    const viewer = pannellum.viewer('panorama', {
        title: 'Grand Horizon, Tsingyi, Hongkong',
        author: 'Barry, Sep 2007',
        northOffset: 130,
        pitch: 0,
        yaw: 0,
        hfov: 100,
        type: 'cubemap',
        cubeMap: [
            basePath + '0.jpg',
            basePath + '1.jpg',
            basePath + '2.jpg',
            basePath + '3.jpg',
            basePath + '4.jpg',
            basePath + '5.jpg'
        ],
        autoLoad: true,
        autoRotate: 2,
        autoRotateInactivityDelay: 2000,
        showControls: true,
        compass: true,
        mouseZoom: true,
        draggable: true,
        friction: 0.15
    });

    const panoElement = document.getElementById('panorama');
    const heightSlider = document.getElementById('heightSlider');
    const heightValue = document.getElementById('heightValue');
    const rotateSpeedInput = document.getElementById('rotateSpeed');

    heightSlider.addEventListener('input', function() {
        const height = this.value + 'px';
        panoElement.style.height = height;
        heightValue.textContent = height;
    });

    document.getElementById('startRotateBtn').addEventListener('click', function() {
        viewer.startAutoRotate(parseFloat(rotateSpeedInput.value) || 2);
    });

    document.getElementById('stopRotateBtn').addEventListener('click', function() {
        viewer.stopAutoRotate();
    });
</script>

</body>
</html>
